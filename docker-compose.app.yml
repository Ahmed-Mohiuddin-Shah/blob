# Control-plane app (Next.js + worker/search WSS).
# Single box: use root docker-compose.yml (includes data + this).
# App host only (point .env DATABASE_URL / MEILI_HOST at the data host):
#   docker compose -f docker-compose.app.yml up -d --build
# Optional: APP_INSTANCE_ID=app-1 for a stable id in /profile/workers + /api/health.

name: blob

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # When included with docker-compose.data.yml these hostnames resolve on the
      # shared Compose network. For a remote data host, set DATABASE_URL and
      # MEILI_HOST in .env instead (Compose still injects the vars below — override
      # by commenting them out or using a host-specific override file).
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}?schema=public}
      RUN_MIGRATIONS: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_DURATION: ${SESSION_DURATION:-3600}
      ZITADEL_DOMAIN: ${ZITADEL_DOMAIN}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
      ZITADEL_CLIENT_SECRET: ${ZITADEL_CLIENT_SECRET}
      ZITADEL_POST_LOGIN_URL: ${ZITADEL_POST_LOGIN_URL:-/profile}
      ZITADEL_POST_LOGOUT_URL: ${ZITADEL_POST_LOGOUT_URL}
      ZITADEL_SERVICE_PAT: ${ZITADEL_SERVICE_PAT:-}
      ZITADEL_ORG_ID: ${ZITADEL_ORG_ID:-}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:-}
      GLASS_API_URL: ${GLASS_API_URL:-}
      GLASS_API_KEY: ${GLASS_API_KEY:-}
      MEILI_HOST: ${MEILI_HOST:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_SEARCH_KEY: ${MEILI_SEARCH_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      OLLAMA_AGENT_MODEL: ${OLLAMA_AGENT_MODEL:-qwen2.5:3b}
      MEILI_MULTIMODAL_URL: ${MEILI_MULTIMODAL_URL:-}
      MEILI_MULTIMODAL_MODEL: ${MEILI_MULTIMODAL_MODEL:-}
      MEILI_MULTIMODAL_API_KEY: ${MEILI_MULTIMODAL_API_KEY:-}
      APP_INSTANCE_ID: ${APP_INSTANCE_ID:-}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_ONLINE_SECONDS: ${WORKER_ONLINE_SECONDS:-45}
    ports:
      - "${APP_PORT:-8080}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
