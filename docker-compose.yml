# BLOB stack (single box): data plane + app.
# Run: docker compose up -d --build
#
# Split hosts:
#   docker compose -f docker-compose.data.yml up -d
#   docker compose -f docker-compose.app.yml up -d --build
#
# Backups: ./storage/backups/postgres/
# Restore: npm run db:restore -- <backup.sql.gz>

name: blob

include:
  - path: docker-compose.data.yml
  - path: docker-compose.app.yml

services:
  app:
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      # Force in-network hosts when using the combined stack.
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}?schema=public
      MEILI_HOST: http://meilisearch:7700
