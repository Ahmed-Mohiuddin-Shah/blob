# BLOB stack: Next.js + Postgres + Meilisearch + daily DB backups.
# Run: docker compose up -d --build
# Backups: ./storage/backups/postgres/
# Restore: npm run db:restore -- <backup.sql.gz>

name: blob

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}?schema=public
      RUN_MIGRATIONS: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_DURATION: ${SESSION_DURATION:-3600}
      ZITADEL_DOMAIN: ${ZITADEL_DOMAIN}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
      ZITADEL_CLIENT_SECRET: ${ZITADEL_CLIENT_SECRET}
      ZITADEL_POST_LOGIN_URL: ${ZITADEL_POST_LOGIN_URL:-/profile}
      ZITADEL_POST_LOGOUT_URL: ${ZITADEL_POST_LOGOUT_URL}
      ZITADEL_SERVICE_PAT: ${ZITADEL_SERVICE_PAT:-}
      ZITADEL_ORG_ID: ${ZITADEL_ORG_ID:-}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:-}
      GLASS_API_URL: ${GLASS_API_URL:-}
      GLASS_API_KEY: ${GLASS_API_KEY:-}
      MEILI_HOST: ${MEILI_HOST:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_SEARCH_KEY: ${MEILI_SEARCH_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
      OLLAMA_AGENT_MODEL: ${OLLAMA_AGENT_MODEL:-qwen2.5:3b}
      MEILI_MULTIMODAL_URL: ${MEILI_MULTIMODAL_URL:-}
      MEILI_MULTIMODAL_MODEL: ${MEILI_MULTIMODAL_MODEL:-}
      MEILI_MULTIMODAL_API_KEY: ${MEILI_MULTIMODAL_API_KEY:-}
    ports:
      - "${APP_PORT:-8080}:3000"
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  meilisearch:
    image: getmeili/meilisearch:v1.16
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PUBLISH_PORT:-7700}:7700"
    volumes:
      - blob_meili_data:/meili_data
    healthcheck:
      # Meili image ships wget; /health returns 200 when ready.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PUBLISH_PORT:-5433}:5432"
    volumes:
      - blob_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z9"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - ./storage/backups/postgres:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  blob_pgdata:
  blob_meili_data:
